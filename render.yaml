services:
  # =====================================================================
  # 1. DJANGO BACKEND WEB SERVICE
  # =====================================================================
  - type: web
    name: performax-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.development
      - key: USE_SQLITE
        value: "True"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECRET_KEY
        generateValue: true

  # =====================================================================
  # 2. REACT FRONTEND STATIC SITE (AUTOMATICALLY CONNECTED TO BACKEND)
  # =====================================================================
  - type: web
    name: performax-frontend
    runtime: static
    rootDir: epms_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://performax-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
