name: Performax CI/CD & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: ⚙️ Backend Test & Invariants Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🩺 Run Django System Integrity Checks
        env:
          SECRET_KEY: ci-cd-secret-key-temporary-validation-12345
          DEBUG: 'True'
          USE_SQLITE: 'True'
        run: |
          python manage.py check

      - name: 🧪 Run Automated Backend Test Suite
        env:
          SECRET_KEY: ci-cd-secret-key-temporary-validation-12345
          DEBUG: 'True'
          USE_SQLITE: 'True'
        run: |
          python manage.py test apps --verbosity=2

  frontend-build:
    name: 🌐 Frontend TypeCheck & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epms_frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: epms_frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🏗️ Build Frontend Distribution
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: performax-frontend-dist
          path: epms_frontend/dist/
          retention-days: 7
