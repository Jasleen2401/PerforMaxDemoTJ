name: Performax CI/CD & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: ⚙️ Backend Test & PostgreSQL Invariants Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intern_pms_test_db
          POSTGRES_USER: intern_pms_user
          POSTGRES_PASSWORD: intern_pms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🩺 Run Django System Integrity Checks
        env:
          SECRET_KEY: ci-cd-secret-key-temporary-validation-12345
          DEBUG: 'True'
          USE_SQLITE: 'False'
          DB_NAME: intern_pms_test_db
          DB_USER: intern_pms_user
          DB_PASSWORD: intern_pms_password
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          python manage.py check

      - name: 🗄️ Run Database Migrations against PostgreSQL
        env:
          SECRET_KEY: ci-cd-secret-key-temporary-validation-12345
          DEBUG: 'True'
          USE_SQLITE: 'False'
          DB_NAME: intern_pms_test_db
          DB_USER: intern_pms_user
          DB_PASSWORD: intern_pms_password
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          python manage.py migrate --noinput

      - name: 🧪 Run Automated Backend Test Suite
        env:
          SECRET_KEY: ci-cd-secret-key-temporary-validation-12345
          DEBUG: 'True'
          USE_SQLITE: 'False'
          DB_NAME: intern_pms_test_db
          DB_USER: intern_pms_user
          DB_PASSWORD: intern_pms_password
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          python manage.py test apps --verbosity=2

  frontend-build:
    name: 🌐 Frontend TypeCheck & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epms_frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: epms_frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🏗️ Build Frontend Distribution
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: performax-frontend-dist
          path: epms_frontend/dist/
          retention-days: 7
